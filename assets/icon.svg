<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Orange ground with a white bell over a house silhouette: a reminder,
       about the home. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9142" />
      <stop offset="1" stop-color="#F26A00" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- House silhouette. Wide enough that the roof slopes stay visible on both
       sides of the bell, which is what makes it read as a house at all. -->
  <g fill="#FFFFFF" opacity="0.26">
    <path d="M512 336 L912 672 L912 862 Q912 890 884 890 L140 890 Q112 890 112 862 L112 672 Z" />
  </g>

