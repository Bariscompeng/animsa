  <g fill="#FFFFFF">
    <path d="M512 196
             C 486 196 466 216 466 242
             L 466 258
             C 372 280 306 364 306 462
             L 306 578
             C 306 620 288 660 256 688
             C 240 702 250 728 272 728
             L 752 728
             C 774 728 784 702 768 688
             C 736 660 718 620 718 578
             L 718 462
             C 718 364 652 280 558 258
             L 558 242
             C 558 216 538 196 512 196 Z" />
    <path d="M512 824
             C 556 824 592 792 598 752
             L 426 752
             C 432 792 468 824 512 824 Z" />
  </g>
</svg>
